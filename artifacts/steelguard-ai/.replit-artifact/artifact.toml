kind = "web"
previewPath = "/"
title = "SteelGuard AI"
description = "A simulated industrial safety command center for workforce digital twins, predictive risk analytics, hazard monitoring, safety alerts, and authority escalation workflows."
version = "1.0.0"
id = "artifacts/steelguard-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23177

[services.development]
run = "pnpm --filter @workspace/steelguard-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/steelguard-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/steelguard-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23177"
BASE_PATH = "/"
